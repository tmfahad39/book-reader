<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novel Library</title>
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:#0b1020;color:#e5e7eb}
header{padding:2rem 1rem;text-align:center;background:linear-gradient(135deg,#009587,#00695c)}
h1{margin:0;font-size:2rem}p.sub{color:#cfd8dc}
main{max-width:960px;margin:2rem auto;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.card{background:#111827;border:1px solid #1f2937;border-radius:.75rem;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.card h2{margin:0;font-size:1.1rem;color:#009587}
.card a{color:#00bcd4;text-decoration:none;font-weight:600}
.upload{grid-column:1/-1;text-align:center;padding:1rem;border:1px dashed #374151;border-radius:.75rem;background:#111827}
button{background:#009587;color:#fff;border:0;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header><h1>Novel Library</h1><p>Read online or load your own EPUB</p></header>
<main>
  <div class="upload">
    <input type="file" id="file" accept=".epub">
    <p>Load a local EPUB to read instantly</p>
  </div>
  <div class="card">
    <h2>Vampire Queen - Season 1</h2>
    <p>EPUB</p>
    <a href="reader.html?book=book.epub">Read</a>
  </div>
</main>
<script>
document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  location.href="reader.html?src="+encodeURIComponent(url);
});
</script>
</body>
</html>
