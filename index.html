<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Reader</title>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#1a1a1a;color:#eee;font-family:system-ui,sans-serif}
#viewer{height:100vh}
#bar{position:fixed;top:0;left:0;right:0;padding:.5rem;display:flex;gap:.5rem;align-items:center;background:rgba(0,0,0,.6);z-index:10}
#bar input{color:#eee}
button{padding:.4rem .8rem;border:0;border-radius:.4rem;background:#333;color:#fff;cursor:pointer}
#controls{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;z-index:10}
</style>
</head>
<body>
<div id="bar">
  <input type="file" id="file" accept=".epub">
  <button id="toc">Contents</button>
</div>
<div id="viewer"></div>
<div id="controls">
  <button id="prev">Prev</button>
  <button id="next">Next</button>
</div>
<script>
let book, rendition;
function load(src){ if(book) book.destroy(); book=ePub(src); rendition=book.renderTo("viewer",{width:"100%",height:"100%"}); rendition.display(); }
load("book.epub");
document.getElementById("file").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) load(f); });
document.getElementById("prev").onclick=()=>rendition.prev();
document.getElementById("next").onclick=()=>rendition.next();
document.getElementById("toc").onclick=async()=>{ const t=await book.loaded.navigation; alert(t.toc.map(x=>x.label).join("\n")); };
</script>
</body>
</html>
