<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novel Library</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
header{padding:1.5rem;text-align:center;background:#1e293b}
h1{margin:0}
main{max-width:900px;margin:2rem auto;padding:0 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.card{background:#1e293b;border-radius:.75rem;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.card h2{margin:0;font-size:1.1rem}
.card a{color:#38bdf8;text-decoration:none;font-weight:600}
.upload{grid-column:1/-1;text-align:center;padding:1rem;border:1px dashed #475569;border-radius:.75rem}
</style>
</head>
<body>
<header><h1>Novel Library</h1><p>Read online or load your own EPUB</p></header>
<main>
  <div class="upload">
    <input type="file" id="file" accept=".epub">
    <p>Load a local EPUB to read instantly</p>
  </div>
  <div class="card">
    <h2>Vampire Queen - Season 1</h2>
    <p>EPUB</p>
    <a href="reader.html?book=book.epub">Read</a>
  </div>
</main>
<script>
document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  location.href="reader.html?src="+encodeURIComponent(url);
});
</script>
</body>
</html>
